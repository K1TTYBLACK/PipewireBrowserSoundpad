<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBS Soundpad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f5f7fa;
            padding: 2rem 1rem;
        }

        .card {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.07);
        }

        .card-header {
            background: #fff;
            border-bottom: 1px solid #dee2e6;
            font-weight: 600;
            border-radius: 10px 10px 0 0 !important;
        }

        .flow-box {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            text-align: center;
            background: #fff;
        }
        .flow-box .label { color: #6c757d; font-size: 0.75rem; }
        .flow-box .name  { font-weight: 600; font-size: 0.9rem; word-break: break-all; }
        .flow-box.connected { border-color: #198754; background: #f0fdf4; }
        .flow-box.disconnected { opacity: 0.55; }

        .flow-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d6efd;
            font-size: 1.2rem;
        }

        .volume-display {
            min-width: 48px;
            text-align: right;
            font-weight: 600;
            color: #0d6efd;
        }

        #toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast-msg {
            background: #212529;
            color: #fff;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            border-left: 4px solid #198754;
            animation: fadeIn 0.2s ease;
        }
        .toast-msg.error { border-color: #dc3545; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
<div class="container" style="max-width: 640px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h4 mb-0 fw-bold">🎙 PBS Soundpad</h1>
            <small class="text-muted">Pipewire Browser Soundpad</small>
        </div>
        <button id="master-toggle" class="btn btn-success px-4">Enable</button>
    </div>

    <!-- Settings Card -->
    <div class="card mb-3">
        <div class="card-header">⚙️ Configuration</div>
        <div class="card-body">

            <!-- Physical Mic -->
            <div class="mb-3">
                <label for="mic-select" class="form-label fw-semibold">Physical Microphone</label>
                <select id="mic-select" class="form-select">
                    <option value="">— No microphone selected —</option>
                </select>
            </div>

            <!-- Mic Gain -->
            <div class="mb-3">
                <label for="mic-volume" class="form-label fw-semibold">Mic Input Gain</label>
                <div class="d-flex align-items-center gap-2">
                    <input type="range" id="mic-volume" class="form-range flex-grow-1"
                           min="0" max="1.5" step="0.05" value="1.0">
                    <span id="mic-volume-val" class="volume-display">100%</span>
                </div>
            </div>

            <hr class="my-3">

            <!-- Target App -->
            <div class="mb-3">
                <label for="app-select" class="form-label fw-semibold">Target Application</label>
                <small class="text-muted d-block mb-1">Browser or app whose audio will be routed into the virtual mic</small>
                <select id="app-select" class="form-select">
                    <option value="">— No application selected —</option>
                </select>
            </div>

            <!-- Browser / App Volume (capture mix level — does NOT change system volume) -->
            <div class="mb-3">
                <label for="app-volume" class="form-label fw-semibold">Browser / App Capture Level</label>
                <small class="text-muted d-block mb-1">
                    Sets how loud the app audio is captured into the virtual mic.
                    Does <strong>not</strong> affect what you hear through your speakers.
                </small>
                <div class="d-flex align-items-center gap-2">
                    <input type="range" id="app-volume" class="form-range flex-grow-1"
                           min="0" max="1.5" step="0.05" value="1.0">
                    <span id="app-volume-val" class="volume-display">100%</span>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button id="save-btn" class="btn btn-primary" disabled>Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Signal Flow Card -->
    <div class="card mb-3">
        <div class="card-header">🔀 Signal Flow</div>
        <div class="card-body p-0">
            <canvas id="flow-canvas" style="width:100%; display:block; border-radius: 0 0 10px 10px;"></canvas>
        </div>
    </div>

    <footer class="text-center text-muted" style="font-size:0.8rem; margin-top:1.5rem;">
        PBS Soundpad · <a href="http://localhost:9876" class="text-muted">localhost:9876</a>
    </footer>
</div>

<div id="toast-container"></div>
<script src="/app.js"></script>
</body>
</html>
